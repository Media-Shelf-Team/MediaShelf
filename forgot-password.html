<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="The Media Shelf Team" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <title>MediaShelf | Forgot Password</title>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner container">
        <a class="logo" href="index.html">Media Shelf</a>
        <div class="site-header__actions">
          <a class="btn btn--outline" href="login.html">Log in</a>
          <a class="btn btn--primary" href="signup.html">Sign up</a>
        </div>
      </div>
    </header>

    <main class="auth-page container">
      <div class="auth-card auth-card--narrow card">
        <div class="auth-card__form">
          <h1 class="display-title">Forgot your password?</h1>
          <p class="auth-card__subtitle">
            Enter your email and we'll send you a link to reset your password.
          </p>

          <form id="forgot-password-form" class="auth-form" method="post">
            <p
              id="forgot-password-error"
              class="form-error"
              role="alert"
              hidden
            ></p>
            <p
              id="forgot-password-success"
              class="form-success"
              role="status"
              hidden
            ></p>

            <div class="auth-field">
              <label class="field-label" for="forgot-email">Email</label>
              <input
                id="forgot-email"
                class="field-input"
                type="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                maxlength="254"
                required
              />
            </div>

            <div class="auth-form__actions">
              <a class="btn btn--outline" href="login.html">Cancel</a>
              <button class="btn btn--primary" type="submit">
                Send reset link
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner container">
        <p><strong>Media Shelf</strong> &copy; 2026</p>
        <ul class="site-footer__links">
          <li><a href="about.html">About</a></li>
        </ul>
      </div>
    </footer>

    <script type="module" src="js/auth/forgotPassword.js"></script>
  </body>
</html>

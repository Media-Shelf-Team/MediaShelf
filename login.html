<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="The Media Shelf Team" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <title>MediaShelf | Log In</title>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner container">
        <a class="logo" href="index.html">Media Shelf</a>
        <div class="site-header__actions">
          <span class="site-header__prompt">New here?</span>
          <a class="btn btn--primary" href="signup.html">Sign up</a>
        </div>
      </div>
    </header>

    <main class="auth-page container">
      <div class="auth-card card">
        <div class="auth-card__form">
          <h1 class="display-title">Welcome back</h1>
          <p class="auth-card__subtitle">Log in to your shelf.</p>

          <form id="login-form" class="auth-form" method="post">
            <p class="form-error" id="login-error" role="alert" hidden></p>

            <div class="auth-field">
              <label class="field-label" for="login-email">Email</label>
              <input
                id="login-email"
                class="field-input"
                type="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="username"
                maxlength="254"
                required
              />
            </div>

            <div class="auth-field">
              <div class="auth-field__row">
                <label class="field-label" for="login-password">Password</label>
                <a class="auth-link" href="forgot-password.html"
                  >Forgot password?</a
                >
              </div>
              <input
                id="login-password"
                class="field-input"
                type="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                maxlength="128"
                required
              />
            </div>

            <button class="btn btn--primary auth-form__submit" type="submit">
              Log In
            </button>
          </form>

          <p class="auth-card__alt">
            Don't have an account?
            <a class="auth-link" href="signup.html">Sign up now.</a>
          </p>
        </div>

        <div class="auth-card__art">
          <img
            class="auth-card__art-img"
            src="assets/img/mediashelfbgidea1.png"
            alt=""
          />
          <div class="auth-card__art-note">
            <h2 class="auth-card__art-title">Pick up where you left off.</h2>
            <p>Your shelf and your ratings are waiting.</p>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner container">
        <p><strong>Media Shelf</strong> &copy; 2026</p>
        <ul class="site-footer__links">
          <li><a href="about.html">About</a></li>
        </ul>
      </div>
    </footer>

    <script type="module" src="js/auth/login.js"></script>
  </body>
</html>

name: CI

on: 
    push:
        branches:
            - "**"
    pull_request:
        branches:
            - main
    workflow_dispatch:  

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint (ESLint and Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
        - name: Checkout repository
          uses: actions/checkout@v5
          with:
            fetch-depth: 0
            ref: ${{ github.ref }}
        
        - name: Set up Node
          uses: actions/setup-node@v5
          with:
            node-version: '24'
            cache: 'npm'

        - name: Install dependencies (ESLint and Prettier)
          run: npm ci

        - name: Check code formatting (Prettier)
          run: npm run format:check

        - name: Lint all JavaScript (ESLint)
          run: npm run lint
    
  
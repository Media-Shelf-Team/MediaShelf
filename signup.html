<!doctype html>
<html lang="en" class="swapped-colors">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="The Media Shelf Team" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bungee&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Protest+Guerrilla&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <title>MediaShelf | Sign Up</title>
  </head>
  <body>
    <main class="signup">
      <div class="signup-box">
        <a class="signup-menu-btn" href="index.html">MENU</a>
        <div class="signup-logo"></div>

        <div class="signup-content">
          <h1 class="signup-title">Sign Up</h1>
          <p class="signup-subtitle">Please enter your information.</p>

          <form id="signup-form" class="signup-form" method="post">
            <p
              class="form-input-error"
              id="signup-error"
              role="alert"
              hidden
            ></p>
            <input
              class="signup-input"
              type="text"
              name="username"
              placeholder="Enter a Username"
              aria-label="Username"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              minlength="3"
              maxlength="30"
              pattern="[a-z0-9_]+"
              title="3–30 characters: lowercase letters, numbers, and underscores"
              required
            />
            <input
              class="signup-input"
              type="email"
              name="email"
              placeholder="Enter Your Email"
              aria-label="Email"
              autocomplete="email"
              maxlength="254"
              required
            />
            <input
              class="signup-input"
              type="password"
              name="password"
              placeholder="Enter Your Password"
              aria-label="Password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
            />
            <input
              class="signup-input"
              type="password"
              name="confirmPassword"
              placeholder="Confirm Password"
              aria-label="Confirm password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
            />
            <button class="signup-submit" type="submit">Sign Up</button>
          </form>

          <p class="signup-alt">
            Already have an account? <a href="login.html">Sign in now.</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="footer footer-fixed">
      <p class="footer-copy">
        &copy; 2026 The Media Shelf Team - All rights reserved.
      </p>
    </footer>

    <script type="module" src="js/auth/signup.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="The Media Shelf Team" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bungee&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Protest+Guerrilla&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <title>MediaShelf | Forgot Password</title>
  </head>
  <body>
    <main class="signup">
      <div class="signup-box signup-box-forgot">
        <a class="signup-menu-btn" href="index.html">MENU</a>
        <div class="signup-logo"></div>

        <div class="signup-content">
          <h1 class="signup-title">Forgot your password?</h1>
          <p class="signup-subtitle">
            Enter your email and we'll send you a link to reset your password.
          </p>

          <form id="forgot-password-form" class="signup-form" method="post">
            <p
              id="forgot-password-error"
              class="form-error"
              role="alert"
              hidden
            ></p>
            <input
              class="signup-input"
              type="email"
              name="email"
              placeholder="Enter Your Email"
              aria-label="Email"
              autocomplete="email"
              maxlength="254"
              required
            />

            <div class="signup-actions">
              <a class="signup-btn signup-btn-cancel" href="login.html"
                >Cancel</a
              >
              <button class="signup-btn signup-btn-reset" type="submit">
                Reset
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer class="footer footer-fixed">
      <p class="footer-copy">
        &copy; 2026 The Media Shelf Team - All rights reserved.
      </p>
    </footer>

    <script type="module" src="js/auth/forgotPassword.js"></script>
  </body>
</html>

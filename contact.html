<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="The Media Shelf Team">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bungee&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Protest+Guerrilla&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/footer.css">
    <title>MediaShelf | Contact Us</title>
</head>
<body>
    <main class="signup">
        <div class="signup__box signup__box--forgot">
            <a class="signup__menu-btn" href="index.html">MENU</a>
            <div class="signup__logo"></div>

            <div class="signup__content">
                <h1 class="signup__title">Contact Us</h1>
                <p class="signup__subtitle">Get in touch with us.</p>

                <form class="signup__form" method="post">
                    <input class="signup__input" type="text" name="name" placeholder="Enter Your Name" aria-label="Name" maxlength="100" required>
                    <input class="signup__input" type="email" name="email" placeholder="Enter Your Email" aria-label="Email" autocomplete="email" maxlength="254" required>
                    <textarea class="signup__input" name="message" placeholder="Enter Your Message" aria-label="Message" rows="5" maxlength="1000" required></textarea>

                    <div class="signup__actions">
                        <a class="signup__btn signup__btn--cancel" href="index.html">Cancel</a>
                        <button class="signup__btn signup__btn--reset" type="submit">Send</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer footer-fixed">
        <p class="footer__copy">&copy; 2026 The Media Shelf Team - All rights reserved.</p>
    </footer>
</body>
</html>

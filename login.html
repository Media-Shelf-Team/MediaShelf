<!doctype html>
<html lang="en" class="swapped-colors">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="The Media Shelf Team" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bungee&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Protest+Guerrilla&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <title>MediaShelf | Log In</title>
  </head>
  <body>
    <main class="signup">
      <div class="signup-box signup-box-login">
        <a class="signup-menu-btn" href="index.html">MENU</a>
        <div class="signup-logo"></div>

        <div class="signup-content">
          <h1 class="signup-title">Welcome Back</h1>
          <p class="signup-subtitle">Please enter your information.</p>

          <form class="signup-form" method="post">
            <input
              class="signup-input"
              type="email"
              name="email"
              placeholder="Enter Your Email"
              aria-label="Email"
              autocomplete="username"
              maxlength="254"
              required
            />
            <input
              class="signup-input"
              type="password"
              name="password"
              placeholder="Enter Your Password"
              aria-label="Password"
              autocomplete="current-password"
              maxlength="128"
              required
            />
            <a class="signup-forgot" href="forgot-password.html"
              >Forgot password?</a
            >
            <button class="signup-submit" type="submit">Sign In</button>
          </form>

          <p class="signup-alt">
            Don't have an account? <a href="signup.html">Sign up now.</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="footer footer-fixed">
      <p class="footer-copy">
        &copy; 2026 The Media Shelf Team - All rights reserved.
      </p>
    </footer>
  </body>
</html>
